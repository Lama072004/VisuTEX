# VisuTeX – Build und Tests auf Windows und Linux.
# Baut die nativen TeX-Bibliotheken statisch (cargo vcpkg), testet Rust-Kern,
# Frontend und das echte Kompilieren mit dem mitgelieferten TeX-Bundle (offline)
# und erzeugt die Installationspakete:
#   Windows: NSIS (.exe) und MSI – WebView2 ist offline enthalten
#   Linux:   .deb (Debian/Ubuntu/Mint), .rpm (Fedora/RHEL), .AppImage (alle Distributionen)
# Anschließend werden die Linux-Pakete auf mehreren Distributionen installiert
# und auf fehlende Bibliotheken geprüft.
#
# Release: Tag `v…` hochladen (z. B. `v0.2.0-alpha.1`) → nach erfolgreichen Tests entsteht ein
# Release-Entwurf mit allen Paketen (Windows: Setup, MSI, portable ZIP, einzelne EXE · Linux: deb, rpm,
# AppImage). Tags mit alpha/beta/rc werden als Vorabversion markiert. Die Version kommt aus dem
# Tag (VISUTEX_VERSION); die Update-Suche der App vergleicht damit die veröffentlichten Releases.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          # Ältestes unterstütztes System: glibc 2.35 / WebKitGTK 4.1
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
    # bash auch unter Windows: bricht beim ersten fehlgeschlagenen Befehl ab
    # (PowerShell würde z. B. eine fehlgeschlagene Formatprüfung übergehen)
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Linux-Systempakete (Tauri/WebKitGTK und vcpkg-Werkzeuge)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libappindicator3-dev librsvg2-dev patchelf build-essential pkg-config rpm file \
            autoconf autoconf-archive automake libtool bison gperf python3 python3-venv

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: vcpkg-Cache
        uses: actions/cache@v5
        with:
          path: src-tauri/target/vcpkg
          key: vcpkg-${{ matrix.target }}-${{ hashFiles('src-tauri/Cargo.toml') }}
          # Cargo.toml ändert sich auch bei jeder neuen Versionsnummer → sonst ginge der Cache
          # verloren und vcpkg müsste alles neu bauen. Der letzte Stand wird übernommen;
          # `cargo vcpkg build` ergänzt nur, was sich wirklich geändert hat.
          restore-keys: |
            vcpkg-${{ matrix.target }}-

      - name: Native Bibliotheken bauen (cargo vcpkg)
        working-directory: src-tauri
        run: |
          # Der Rust-Cache (target/) kann Reste von target/vcpkg ohne Git-Daten mitbringen;
          # dann scheitert `git clone` („destination path already exists“) → Reste entfernen.
          if [ -d target/vcpkg ] && [ ! -d target/vcpkg/.git ]; then
            echo "Unvollständiges target/vcpkg (ohne .git) – wird entfernt"
            rm -rf target/vcpkg
          fi
          cargo install cargo-vcpkg --locked
          cargo vcpkg -v build --target ${{ matrix.target }}
          # Zwischenordner der C-Bibliotheken werden nicht mehr gebraucht (fertig in installed/).
          # Sie enthalten tote Verknüpfungen, über die der Rust-Cache beim Aufräumen stolpert
          # („ENOENT … buildtrees/…/tests/target“ als Annotation) – und machen die Caches nur größer.
          rm -rf target/vcpkg/buildtrees

      - name: vcpkg-Bibliotheken (Linux, zur Fehlersuche)
        if: runner.os == 'Linux'
        run: ls -la src-tauri/target/vcpkg/installed/x64-linux/lib || true

      # Release-Tags (v0.2.0-alpha.2 …): Version für die Update-Suche der App
      - name: Version aus dem Tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "VISUTEX_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Frontend – Abhängigkeiten, Tests, Build
        run: |
          npm ci
          npm test
          npm run build

      - name: Rust – Format und Tests
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo test --lib
          cargo test --test core_roundtrip
          cargo test --test foreign_documents
          cargo test --test compile_pipeline -- --ignored --nocapture --test-threads=1

      - name: Exportiertes Volltest-Dokument für den TeX-Live-Test sichern
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: visutex-roundtrip
          path: src-tauri/target/visutex-roundtrip
          if-no-files-found: error

      - name: Installationspakete erzeugen
        run: npx tauri build --target ${{ matrix.target }}

      - name: Portable Windows-Version (ZIP)
        if: runner.os == 'Windows'
        run: node scripts/portable.mjs --target ${{ matrix.target }} --zip --exe

      - uses: actions/upload-artifact@v6
        with:
          name: visutex-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*-setup.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/*-portable.zip
            src-tauri/target/${{ matrix.target }}/release/*_windows_x64.exe
          if-no-files-found: error

  # Portabilität: das exportierte Dokument muss mit TeX Live auf allen drei Engines
  # (inkl. BibTeX) kompilieren – unabhängig vom mitgelieferten Bundle.
  latex-engines:
    needs: build
    runs-on: ubuntu-24.04  # fest statt ubuntu-latest (wechselt ab 19.10.2026 auf Ubuntu 26)
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: visutex-roundtrip
          path: roundtrip
      - name: pdfLaTeX, XeLaTeX und LuaLaTeX
        shell: bash
        run: |
          bash scripts/check-latex-engines.sh roundtrip doc
          # deutscher IEEE-Stil (visutex-ieee-de.bst liegt daneben)
          bash scripts/check-latex-engines.sh roundtrip doc-de

  # Frische Installation auf verschiedenen Distributionen: Paket installieren und
  # prüfen, dass alle Bibliotheken gefunden werden (ohne weitere Schritte).
  linux-distributionen:
    needs: build
    runs-on: ubuntu-24.04  # fest statt ubuntu-latest (wechselt ab 19.10.2026 auf Ubuntu 26)
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
            kind: deb
          - image: ubuntu:24.04
            kind: deb
          - image: debian:12
            kind: deb
          - image: linuxmintd/mint22-amd64
            kind: deb
          - image: fedora:40
            kind: rpm
          - image: archlinux:latest
            kind: arch
          - image: opensuse/tumbleweed
            kind: appimage
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: visutex-x86_64-unknown-linux-gnu
          path: pakete
      - name: Installieren und Bibliotheken prüfen
        shell: bash
        run: |
          set -euo pipefail
          # Minimale Container (openSUSE) haben kein `find`
          if ! command -v find >/dev/null; then
            zypper --non-interactive install findutils
          fi
          deb=$(find pakete -name '*.deb' | head -n1)
          rpm=$(find pakete -name '*.rpm' | head -n1)
          appimage=$(find pakete -name '*.AppImage' | head -n1)
          libpath=""
          case "${{ matrix.kind }}" in
            deb)
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y "./$deb"
              binary=$(find /usr/bin -maxdepth 1 -iname visutex | head -n1) ;;
            rpm)
              dnf install -y "./$rpm"
              binary=$(find /usr/bin -maxdepth 1 -iname visutex | head -n1) ;;
            arch)
              pacman -Syu --noconfirm --needed base-devel binutils webkit2gtk-4.1 gtk3 fontconfig
              useradd -m bauer
              cp "$deb" packaging/arch/
              # Version aus dem Dateinamen der .deb übernehmen (PKGBUILD nicht bei jeder Version anpassen)
              version=$(basename "$deb" | sed -E 's/^VisuTeX_(.+)_amd64\.deb$/\1/')
              sed -i "s/^pkgver=.*/pkgver=${version}/" packaging/arch/PKGBUILD
              chown -R bauer packaging/arch
              su bauer -c "cd packaging/arch && makepkg --noconfirm --skipchecksums"
              pacman -U --noconfirm packaging/arch/*.pkg.tar.zst
              binary=$(find /usr/bin -maxdepth 1 -iname visutex | head -n1) ;;
            appimage)
              zypper --non-interactive install file
              # Bibliotheken, die AppImages bewusst nicht mitbringen (offizielle „excludelist“:
              # Grafiktreiber, X11, Schriften) – auf jedem Linux-Desktop vorhanden, im minimalen
              # Container nicht. Wie auf einem Desktop nachinstallieren (über die Sonames).
              zypper --non-interactive install \
                'libX11.so.6()(64bit)' 'libX11-xcb.so.1()(64bit)' 'libxcb.so.1()(64bit)' \
                'libfontconfig.so.1()(64bit)' 'libfreetype.so.6()(64bit)' 'libharfbuzz.so.0()(64bit)' \
                'libfribidi.so.0()(64bit)' 'libexpat.so.1()(64bit)' 'libcom_err.so.2()(64bit)' \
                'libGL.so.1()(64bit)' 'libEGL.so.1()(64bit)' 'libgbm.so.1()(64bit)' 'libdrm.so.2()(64bit)'
              chmod +x "$appimage"
              cd /tmp && "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null
              binary=$(find /tmp/squashfs-root/usr/bin -maxdepth 1 -iname visutex | head -n1)
              # nur für ldd – sonst lädt auch grep die Bibliotheken aus dem AppImage
              libpath=/tmp/squashfs-root/usr/lib ;;
          esac
          test -x "$binary"
          if LD_LIBRARY_PATH="$libpath" ldd "$binary" | grep "not found"; then
            echo "Fehlende Bibliotheken auf ${{ matrix.image }}"; exit 1
          fi
          # TeX-Bundle ist in das Programm eingebettet (≈ 66 MB) → Programm muss entsprechend groß sein
          size=$(stat -c %s "$binary")
          echo "Programmgröße: $size Bytes"
          test "$size" -gt 100000000
          echo "OK: ${{ matrix.image }}"

  # Release-Entwurf mit allen Paketen – nur für Tags `v…` und nur, wenn alles grün ist.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, latex-engines, linux-distributionen]
    runs-on: ubuntu-24.04  # fest statt ubuntu-latest (wechselt ab 19.10.2026 auf Ubuntu 26)
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: visutex-*-*
          path: pakete
      - name: Dateien sammeln
        run: |
          mkdir -p upload
          find pakete -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*-setup.exe' -o -name '*.msi' -o -name '*-portable.zip' -o -name '*_windows_x64.exe' \) -exec cp {} upload/ \;
          ls -la upload
      - uses: softprops/action-gh-release@v3
        with:
          files: upload/*
          draft: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
